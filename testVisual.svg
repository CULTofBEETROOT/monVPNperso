<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <rect width="100%" height="100%" fill="#101018"/>
  <defs>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="600" y="140" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="76" font-weight="bold"
        fill="#ff00cc" filter="url(#glow)">
    mon VPN perso
    <animate attributeName="fill"
             values="#ff00cc;#00eaff;#b6ff00;#ff9900;#ff00cc"
             dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
